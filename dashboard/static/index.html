<!doctype html>
<html lang="en">

<body>
  <header>
    <h1>Dynaswarm</h1>
    <p class="sub">Phase 1 · segment 7 — the graph at t=0, drawn at the

  </header>

  <section>
    <div id="figure">
      <svg id="canvas" role="img" aria-label="graph at t=0"></svg>
      <p id="refusal" class="refusal" hidden></p>

    <dl id="summary"><dd class="pending">asking the engine…</dd></dl>
  </section>

  <section>
    <h2>Graph at t=0</h2>
    <dl id="graph"><dd class="pending">asking the engine…</dd></dl>
  </section>

  <section>
    <h2>Runs on disk</h2>
    <dl id="runs"><dd class="pending">reading outputs/…</dd></dl>
    <p id="warning" class="warning" hidden></p>
  </section>

  <footer>
    <p>Local development server. Not hosted, not exposed, not deployed.</p>
  </footer>

  <script src="/static/app.js"></script>
