defaults:
  - base_config
  - graph: small30
  - scenario: moderate
  - experiment: smoke
  - budget: eval300
  - _self_

root_seed: 42

hydra:
  # Each run owns its directory and the process works inside it, so
  # results land beside the config that produced them with no path
  # bookkeeping in the code.  Hydra stopped doing this by default in 1.2.
  job:
    chdir: true
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
