[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynaswarm"
version = "0.1.0"
description = "Adaptive Swarm Intelligence for Dynamic Path Optimization"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "networkx>=3.3",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=15",
    "hydra-core>=1.3",
    "optuna>=4.0",
    "joblib>=1.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
viz = ["pygame>=2.5"]
dev = ["pytest>=8", "ruff>=0.6"]
# Dashboard only, and deliberately not a core dependency: `dynaswarm` must
# stay installable and fully testable without a web stack. test_hygiene
# bans both names throughout src/, so nothing under the science surface
# can import them even by accident.
# httpx is here only because starlette's TestClient needs it for the
# serialisation smoke test. Its error message tells you to install
# httpx2; testclient.py falls back to httpx, which is what is
# authorised, so read the source rather than the message.
dashboard = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[project.scripts]
dpo = "dynaswarm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: long-running experiment tests"]
